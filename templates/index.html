<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles.css">
    <title>l1ghtw0rk by d4rkc0de</title>
</head>
<body>
    <form action="/add_user" method="POST">
    <div class="mainer-than-main">
    <div class="main-inputs">
        <div class="text">
            <label for="full-name">Full Name</label>
            <br>
            <label for="username">Username</label>
            <br>
            <label for="password">Password</label>
            <br>
            <label for="branch">Branch</label>
            <br>
            <label for="experience">Experience</label>
        </div>
        
        <div class="input-boxes">
            <input type="text" id="full-name" name="full-name">
            <br>
            <input type="text" id="username" name="username">
            <br>
            <input type="text" id="password" name="password">
            <br>
            <input type="text" id="branch" name="branch">
            <br>
            <input type="range" id="experience" name="experience" min="0" max="10">
        </div>
        
    </div>
    <button type="submit" id="reg">Register</button>
    </div>
    </form>
    <script>

        const button = document.getElementById('reg');

        button.addEventListener('click', async () =>{
            for (const x of document.getElementsByTagName('input')){
                if (x.value === ''){
                    console.log("empty");
                    alert("Please fill out all fields.");
                    return;
                }
            }
            const payload = {
                fullName: document.getElementById('full-name').value,
                username: document.getElementById('username').value,
                password: btoa(document.getElementById('password').value),
                branch: document.getElementById('branch').value,
                experience: document.getElementById('experience').value
            };
            try {
                const response = await fetch('/add_user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload) 
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Success: " + result.message);
                    document.querySelectorAll('input').forEach(input => input.value = '');
                } else {
                    alert("Error: " + result.error);
                }

            } catch (error) {
                console.error("Network error:", error);
                alert("Could not connect to the server.");
            }
            document.cookie = `name=${document.getElementById('full-name').value}; path=/`;
            document.cookie = `username=${document.getElementById('username').value}; path=/`;
            document.cookie = `branch=${document.getElementById('branch').value}; path=/`;
            document.cookie = `password=${btoa(document.getElementById('password').value)}; path=/`;
            // not secure at all.
            // console.log(document.cookie);
            window.location.reload();
            return;
        })
        


    </script>
</body>
</html>
