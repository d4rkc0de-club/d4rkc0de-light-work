<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles.css">
    <title>l1ghtw0rk by d4rkc0de</title>
</head>
<body>
    <div class="mainer-than-main">
    <div class="main-inputs">
        <div class="text">
            <label for="full-name">Full Name</label>
            <br>
            <label for="username">Username</label>
            <br>
            <label for="branch">Branch</label>
            <br>
            <label for="experience">Experience</label>
        </div>

        <div class="input-boxes">
            <input type="text" id="full-name" name="full-name">
            <br>
            <input type="text" id="username" name="username">
            <br>
            <input type="text" id="branch" name="branch">
            <br>
            <input type="range" id="experience" name="experience" min="0" max="10">
        </div>
        
    </div>
    <button type="submit" id="reg">Register</button>
    </div>
    <script>

        
        const button = document.getElementById('reg');

        button.addEventListener('click', () =>{
            for (const x of document.getElementsByTagName('input')){
                if (x.value === ''){
                    console.log("empty");
                    return;
                }
            }
            document.cookie = `name=${document.getElementById('full-name').value}; path=/`;
            document.cookie = `username=${document.getElementById('username').value}; path=/`;
            document.cookie = `branch=${document.getElementById('branch').value}; path=/`;
            document.cookie = `device=${self.crypto.randomUUID()}; path=/`;
            // not secure at all.
            // console.log(document.cookie);
            window.location.reload();
            return;
        })
        


    </script>
</body>
</html>
