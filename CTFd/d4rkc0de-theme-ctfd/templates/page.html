{% extends "base.html" %}

{% block content %}
{% if request.path == '/' %}
  <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: calc(100vh - 120px); padding: 24px;">
    <h1 style="font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 700; letter-spacing: -2px; line-height: 1; margin-bottom: 12px;">
      d4rk<span style="color: #4ade80;">c0de</span>
    </h1>
    <p style="font-size: 15px; color: #8b8b96; max-width: 360px; line-height: 1.6; margin-bottom: 32px;">
      A mini capture-the-flag competition. Solve challenges, find flags, climb the leaderboard.
    </p>
    {% if not authed() %}
      <a href="{{ url_for('auth.register') }}" class="btn btn-primary" style="width: 100%; max-width: 320px; font-size: 14px; font-weight: 500; padding: 12px 24px;">Register</a>
    {% else %}
      <a href="{{ url_for('challenges.listing') }}" class="btn btn-primary" style="width: 100%; max-width: 320px; font-size: 14px; font-weight: 500; padding: 12px 24px;">Play Now</a>
    {% endif %}
  </div>
{% else %}
  <div class="container main-container pt-5">
    <div class="row">
      <div class="col-md-12">
        {{ content | safe }}
      </div>
    </div>
  </div>
{% endif %}
{% endblock %}
